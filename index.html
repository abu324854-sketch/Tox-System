<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tox-System Launcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #030712;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.15);
        }
        .app-icon:active {
            transform: scale(0.92);
        }
        /* Bildirishnoma va boshqaruv parda */
        #drop-panel {
            transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
            transform: translateY(-100%);
        }
        #drop-panel.active {
            transform: translateY(0);
        }
        /* Ilova oynasi */
        #app-window {
            transition: all 0.25s ease-out;
            transform: scale(0.96);
            opacity: 0;
            pointer-events: none;
        }
        #app-window.active {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="text-white h-screen flex flex-col justify-between p-4 select-none relative">

    <!-- Status Bar -->
    <div onclick="togglePanel()" class="glass flex justify-between items-center text-xs text-sky-300 px-4 py-2.5 rounded-2xl shadow-lg z-30 cursor-pointer">
        <span id="clock" class="font-mono font-bold">00:00</span>
        <span class="tracking-widest font-extrabold text-sky-400">TOX-SYSTEM</span>
        <span id="battery" class="font-mono">--% ⚡</span>
    </div>

    <!-- Yuqoridan tushuvchi professional Control Center -->
    <div id="drop-panel" class="absolute inset-x-4 top-16 glass rounded-3xl p-5 z-40 shadow-2xl border border-sky-500/30">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
            <span class="text-xs font-bold tracking-widest text-sky-400">BOSHQARUV MARKAZI</span>
            <button onclick="togglePanel()" class="text-slate-400 text-sm">✕</button>
        </div>
        <div class="grid grid-cols-3 gap-3">
            <div class="glass p-3 rounded-2xl text-center">
                <span class="text-xl">🛡️</span>
                <p class="text-[10px] mt-1 text-slate-300">Himoyalangan</p>
            </div>
            <div class="glass p-3 rounded-2xl text-center">
                <span class="text-xl">📡</span>
                <p class="text-[10px] mt-1 text-slate-300">Node Sync</p>
            </div>
            <div class="glass p-3 rounded-2xl text-center">
                <span class="text-xl">⚡</span>
                <p class="text-[10px] mt-1 text-slate-300">Optimizatsiya</p>
            </div>
        </div>
    </div>

    <!-- Ish stoli va Ilovalar Grid -->
    <div class="flex-1 flex flex-col justify-center items-center px-2 z-10">
        <div class="w-full max-w-sm mb-6 text-center">
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-500">Tox-System</h1>
            <p class="text-[11px] text-slate-500 mt-1 uppercase tracking-wider">Professional Ekotizim Yadrosi</p>
        </div>

        <div class="grid grid-cols-4 gap-4 w-full max-w-sm">
            <div onclick="openApp('Himoya', '🛡️', 'Tizim xavfsizlik devori to\'liq quvvatda ishlamoqda. Tahdidlar aniqlanmadi.')" class="app-icon glass flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">🛡️</span>
                <span class="text-[10px] text-slate-300">Himoya</span>
            </div>
            <div onclick="openApp('Bulut', '🗄️', 'Maxfiy bulut xotirasi ulandi. Barcha fayllar shifrlangan.')" class="app-icon glass flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">🗄️</span>
                <span class="text-[10px] text-slate-300">Bulut</span>
            </div>
            <div onclick="openApp('Terminal', '💻', 'root@tox-system:~# system-check --ok\nKernel: Toxirjon-Core active.')" class="app-icon glass flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">💻</span>
                <span class="text-[10px] text-slate-300">Terminal</span>
            </div>
            <div onclick="openApp('Temir', '📊', 'Markaziy protsessor va xotira holati barqaror.')" class="app-icon glass flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">📊</span>
                <span class="text-[10px] text-slate-300">Temir</span>
            </div>
            <div onclick="openApp('Aloqa', '📡', 'Shaxsiy chastota tarmog\'i ulangan.')" class="app-icon glass flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">📡</span>
                <span class="text-[10px] text-slate-300">Aloqa</span>
            </div>
            <div onclick="openApp('Fayllar', '📁', '/system/core/ - Barcha modullar joyida.')" class="app-icon glass flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">📁</span>
                <span class="text-[10px] text-slate-300">Fayllar</span>
            </div>
            <div onclick="openApp('Shifr', '🔐', 'AES-256 shifrlash protokoli faol.')" class="app-icon glass flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">🔐</span>
                <span class="text-[10px] text-slate-300">Shifr</span>
            </div>
            <div onclick="openApp('Sozlamalar', '⚙️', 'Tox-System v1.0. Muallif: Fattoxov Abdulloh.')" class="app-icon glass flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">⚙️</span>
                <span class="text-[10px] text-slate-300">Sozlama</span>
            </div>
        </div>
    </div>

    <!-- To'liq ekran Ilova Oynasi -->
    <div id="app-window" class="absolute inset-4 top-16 bottom-20 glass rounded-3xl p-6 flex flex-col justify-between z-20 shadow-2xl border border-sky-500/30">
        <div>
            <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
                <div class="flex items-center space-x-3">
                    <span id="app-icon-lg" class="text-3xl">📱</span>
                    <h2 id="app-title-lg" class="text-lg font-bold text-sky-400">Modul</h2>
                </div>
                <button onclick="closeApp()" class="glass w-8 h-8 rounded-full flex items-center justify-center text-sm text-slate-300">✕</button>
            </div>
            <div id="app-content-lg" class="text-sm text-slate-300 font-mono leading-relaxed whitespace-pre-line">
                Yuklanmoqda...
            </div>
        </div>
        <div class="text-center text-[10px] text-slate-500 font-mono">Tox-System Core Environment</div>
    </div>

    <!-- Pastki Dock -->
    <div class="glass rounded-2xl p-3 flex justify-around items-center z-10">
        <button onclick="closeApp(); togglePanel(false);" class="text-xl">🏛️</button>
        <button onclick="openApp('Terminal', '💻', 'root@tox-system:~# direct-exec')" class="text-xl">⚡</button>
        <button onclick="openApp('Sozlamalar', '⚙️', 'Tox-System v1.0')" class="text-xl">⚙️</button>
    </div>

    <script>
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        if ('getBattery' in navigator) {
            navigator.getBattery().then(b => {
                document.getElementById('battery').innerText = Math.round(b.level * 100) + '% ⚡';
            });
        } else {
            document.getElementById('battery').innerText = '100% ⚡';
        }

        function togglePanel(force) {
            const p = document.getElementById('drop-panel');
            if (force === false) p.classList.remove('active');
            else p.classList.toggle('active');
        }

        function openApp(name, icon, content) {
            togglePanel(false);
            document.getElementById('app-title-lg').innerText = name;
            document.getElementById('app-icon-lg').innerText = icon;
            document.getElementById('app-content-lg').innerText = content;
            document.getElementById('app-window').classList.add('active');
        }

        function closeApp() {
            document.getElementById('app-window').classList.remove('active');
        }

        // Swipe down to open panel
        let startY = 0;
        window.addEventListener('touchstart', e => startY = e.touches[0].clientY);
        window.addEventListener('touchend', e => {
            if (startY < 50 && e.changedTouches[0].clientY - startY > 50) togglePanel(true);
        });
    </script>
</body>
</html>
