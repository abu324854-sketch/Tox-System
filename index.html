<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tox-System Sovereign Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        body {
            background: #010409;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: manipulation;
        }
        .tox-glass {
            background: rgba(3, 7, 18, 0.95);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(14, 165, 233, 0.25);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.05);
        }
        .app-icon:active {
            transform: scale(0.92);
        }
        #app-window {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }
        #app-window.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        /* Ekran yorqinligi uchun qoraytirish effekti */
        #brightness-overlay {
            position: fixed;
            inset: 0;
            background: black;
            pointer-events: none;
            opacity: 0;
            z-index: 99;
            transition: opacity 0.2s ease;
        }
    </style>
</head>
<body class="text-white h-screen flex flex-col justify-between p-3 select-none relative">

    <!-- Yorqinlik pardasi -->
    <div id="brightness-overlay"></div>

    <!-- Status Paneli -->
    <div class="tox-glass flex justify-between items-center text-xs text-sky-400 px-4 py-2 rounded-xl z-30">
        <span id="clock" class="font-mono">00:00:00</span>
        <span class="tracking-widest font-black text-[10px]">TOXIRJON // SECURE</span>
        <span id="battery" class="font-mono">--% ⚡</span>
    </div>

    <!-- Asosiy Dasturlar Grid Paneli -->
    <div class="flex-1 flex flex-col justify-center items-center px-1 z-10 overflow-y-auto py-2">
        <div class="w-full max-w-sm mb-3 text-center">
            <h1 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-500">Tox-System</h1>
            <p class="text-[9px] text-slate-500 uppercase tracking-wider">To'liq Boshqariladigan Ekotizim</p>
        </div>

        <div class="grid grid-cols-4 gap-2.5 w-full max-w-sm">
            <div onclick="openApp('Aloqa')" class="app-icon tox-glass flex flex-col items-center justify-center p-2.5 rounded-2xl cursor-pointer transition">
                <span class="text-xl mb-1">📞</span>
                <span class="text-[9px] text-slate-300">Aloqa</span>
            </div>
            <div onclick="openApp('Xabarlar')" class="app-icon tox-glass flex flex-col items-center justify-center p-2.5 rounded-2xl cursor-pointer transition">
                <span class="text-xl mb-1">💬</span>
                <span class="text-[9px] text-slate-300">Xabar</span>
            </div>
            <div onclick="openApp('Kamera')" class="app-icon tox-glass flex flex-col items-center justify-center p-2.5 rounded-2xl cursor-pointer transition">
                <span class="text-xl mb-1">📷</span>
                <span class="text-[9px] text-slate-300">Kamera</span>
            </div>
            <div onclick="openApp('Galereya')" class="app-icon tox-glass flex flex-col items-center justify-center p-2.5 rounded-2xl cursor-pointer transition">
                <span class="text-xl mb-1">🖼️</span>
                <span class="text-[9px] text-slate-300">Galereya</span>
            </div>
            <div onclick="openApp('Brauzer')" class="app-icon tox-glass flex flex-col items-center justify-center p-2.5 rounded-2xl cursor-pointer transition">
                <span class="text-xl mb-1">🌐</span>
                <span class="text-[9px] text-slate-300">Brauzer</span>
            </div>
            <div onclick="openApp('Musiqa')" class="app-icon tox-glass flex flex-col items-center justify-center p-2.5 rounded-2xl cursor-pointer transition">
                <span class="text-xl mb-1">🎵</span>
                <span class="text-[9px] text-slate-300">Musiqa</span>
            </div>
            <div onclick="openApp('Fayllar')" class="app-icon tox-glass flex flex-col items-center justify-center p-2.5 rounded-2xl cursor-pointer transition">
                <span class="text-xl mb-1">📁</span>
                <span class="text-[9px] text-slate-300">Fayllar</span>
            </div>
            <div onclick="openApp('Himoya')" class="app-icon tox-glass flex flex-col items-center justify-center p-2.5 rounded-2xl cursor-pointer transition">
                <span class="text-xl mb-1">🛡️</span>
                <span class="text-[9px] text-slate-300">Himoya</span>
            </div>
            <div onclick="openApp('Bulut')" class="app-icon tox-glass flex flex-col items-center justify-center p-2.5 rounded-2xl cursor-pointer transition">
                <span class="text-xl mb-1">🗄️</span>
                <span class="text-[9px] text-slate-300">Bulut</span>
            </div>
            <div onclick="openApp('Terminal')" class="app-icon tox-glass flex flex-col items-center justify-center p-2.5 rounded-2xl cursor-pointer transition">
                <span class="text-xl mb-1">💻</span>
                <span class="text-[9px] text-slate-300">Terminal</span>
            </div>
            <div onclick="openApp('Temir')" class="app-icon tox-glass flex flex-col items-center justify-center p-2.5 rounded-2xl cursor-pointer transition">
                <span class="text-xl mb-1">📊</span>
                <span class="text-[9px] text-slate-300">Temir</span>
            </div>
            <div onclick="openApp('Sozlamalar')" class="app-icon tox-glass flex flex-col items-center justify-center p-2.5 rounded-2xl cursor-pointer transition">
                <span class="text-xl mb-1">⚙️</span>
                <span class="text-[9px] text-slate-300">Sozlama</span>
            </div>
        </div>
    </div>

    <!-- Yashirin inputlar -->
    <input type="file" id="file-input" class="hidden" onchange="loadUploadedFile(this)">
    <input type="file" id="music-input" accept="audio/*" class="hidden" onchange="loadMusicFile(this)">

    <!-- To'liq ekran Ilova Oynasi -->
    <div id="app-window" class="absolute inset-x-2 bottom-2 top-14 tox-glass rounded-2xl p-4 flex flex-col justify-between z-20 shadow-2xl border border-sky-500/40">
        <div>
            <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-3">
                <div class="flex items-center space-x-2">
                    <span id="app-icon-lg" class="text-xl">⚡</span>
                    <h2 id="app-title-lg" class="text-xs font-bold tracking-wider text-sky-400">MODUL</h2>
                </div>
                <button onclick="closeApp()" class="text-slate-400 hover:text-white text-xs px-2 py-0.5 rounded bg-slate-900 border border-slate-800">[YOPISH]</button>
            </div>
            <!-- Dinamik Ilova Kontenti -->
            <div id="app-content-lg" class="text-xs text-slate-300 font-mono leading-relaxed overflow-y-auto max-h-[60vh]">
                Yuklanmoqda...
            </div>
        </div>
        <div class="text-center text-[8px] text-slate-600 font-mono tracking-widest pt-2 border-t border-slate-900">
            TOX-SYSTEM // SOVEREIGN ARCHITECTURE
        </div>
    </div>

    <!-- Pastki Dock -->
    <div class="tox-glass rounded-xl p-2.5 flex justify-around items-center z-10">
        <button onclick="closeApp()" class="text-xs tracking-widest text-sky-400">◆ ASOSIY</button>
        <button onclick="openApp('Terminal')" class="text-xs tracking-widest text-slate-400">◆ BUYRUQ</button>
        <button onclick="openApp('Sozlamalar')" class="text-xs tracking-widest text-slate-400">◆ SOZLAMALAR</button>
    </div>

    <script>
        let videoStream = null;
        let audioPlayer = null;

        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        if ('getBattery' in navigator) {
            navigator.getBattery().then(b => {
                document.getElementById('battery').innerText = Math.round(b.level * 100) + '% ⚡';
            });
        } else {
            document.getElementById('battery').innerText = '100% ⚡';
        }

        function closeApp() {
            stopCamera();
            if(audioPlayer) { audioPlayer.pause(); audioPlayer = null; }
            document.getElementById('app-window').classList.remove('active');
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        function openApp(appName) {
            stopCamera();
            if(audioPlayer && appName !== 'Musiqa') { audioPlayer.pause(); audioPlayer = null; }

            const titleEl = document.getElementById('app-title-lg');
            const iconEl = document.getElementById('app-icon-lg');
            const contentEl = document.getElementById('app-content-lg');

            titleEl.innerText = appName.toUpperCase();
            document.getElementById('app-window').classList.add('active');

            switch(appName) {
                case 'Aloqa':
                    iconEl.innerText = '📞';
                    contentEl.innerHTML = `
                        <div class="flex flex-col items-center space-y-3">
                            <input type="text" id="phone-number" readonly class="w-full bg-slate-900 border border-sky-500/40 text-center text-lg p-2 rounded-xl font-mono text-sky-300" placeholder="+998 ...">
                            <div class="grid grid-cols-3 gap-2 w-full max-w-xs">
                                <button onclick="pressNum('1')" class="p-3 bg-slate-900 rounded-xl font-bold border border-slate-800">1</button>
                                <button onclick="pressNum('2')" class="p-3 bg-slate-900 rounded-xl font-bold border border-slate-800">2</button>
                                <button onclick="pressNum('3')" class="p-3 bg-slate-900 rounded-xl font-bold border border-slate-800">3</button>
                                <button onclick="pressNum('4')" class="p-3 bg-slate-900 rounded-xl font-bold border border-slate-800">4</button>
                                <button onclick="pressNum('5')" class="p-3 bg-slate-900 rounded-xl font-bold border border-slate-800">5</button>
                                <button onclick="pressNum('6')" class="p-3 bg-slate-900 rounded-xl font-bold border border-slate-800">6</button>
                                <button onclick="pressNum('7')" class="p-3 bg-slate-900 rounded-xl font-bold border border-slate-800">7</button>
                                <button onclick="pressNum('8')" class="p-3 bg-slate-900 rounded-xl font-bold border border-slate-800">8</button>
                                <button onclick="pressNum('9')" class="p-3 bg-slate-900 rounded-xl font-bold border border-slate-800">9</button>
                                <button onclick="pressNum('*')" class="p-3 bg-slate-900 rounded-xl font-bold border border-slate-800">*</button>
                                <button onclick="pressNum('0')" class="p-3 bg-slate-900 rounded-xl font-bold border border-slate-800">0</button>
                                <button onclick="pressNum('#')" class="p-3 bg-slate-900 rounded-xl font-bold border border-slate-800">#</button>
                            </div>
                            <button onclick="makeCall()" class="w-full py-3 bg-emerald-600 rounded-xl font-bold text-white shadow-lg">Qo'ng'iroq qilish 📞</button>
                        </div>
                    `;
                    break;

                case 'Xabarlar':
                    iconEl.innerText = '💬';
                    contentEl.innerHTML = `
                        <div class="flex flex-col space-y-3">
                            <div class="p-3 bg-slate-900 rounded-xl border border-slate-800">
                                <p class="text-[10px] text-sky-400 font-bold">Tox-System Security</p>
                                <p class="text-xs text-slate-300 mt-1">Xush kelibsiz! Barcha xabarlar shifrlangan tarmoq orqali himoyalangan.</p>
                            </div>
                            <textarea id="sms-text" rows="3" class="w-full bg-slate-900 border border-sky-500/30 p-2.5 rounded-xl text-white text-xs" placeholder="Xabar matnini kiriting..."></textarea>
                            <button onclick="sendSms()" class="py-2.5 bg-sky-600 rounded-xl font-bold text-white text-xs">Shifrlangan Xabar Yuborish 💬</button>
                        </div>
                    `;
                    break;

                case 'Kamera':
                    iconEl.innerText = '📷';
                    contentEl.innerHTML = `
                        <div class="flex flex-col items-center space-y-3">
                            <video id="video" autoplay playsinline class="w-full h-56 object-cover rounded-xl border border-sky-500/30"></video>
                            <p class="text-[10px] text-slate-400">Optik sensor faol va ishlamoqda.</p>
                        </div>
                    `;
                    startCamera();
                    break;

                case 'Galereya':
                    iconEl.innerText = '🖼️';
                    contentEl.innerHTML = `
                        <div class="flex flex-col space-y-3 text-center">
                            <div class="p-6 border-2 border-dashed border-sky-500/30 rounded-xl cursor-pointer" onclick="document.getElementById('file-input').click()">
                                <span class="text-3xl">📥</span>
                                <p class="text-xs text-slate-400 mt-2">Rasm yoki media qo'shish uchun bosing</p>
                            </div>
                            <div id="gallery-grid" class="grid grid-cols-2 gap-2 mt-2"></div>
                        </div>
                    `;
                    break;

                case 'Brauzer':
                    iconEl.innerText = '🌐';
                    contentEl.innerHTML = `
                        <div class="flex flex-col space-y-3">
                            <div class="flex space-x-2">
                                <input type="text" id="browser-url" value="https://wikipedia.org" class="flex-1 bg-slate-900 border border-sky-500/30 px-3 py-2 rounded-xl text-xs text-white">
                                <button onclick="loadWeb()" class="px-4 bg-sky-600 rounded-xl text-xs font-bold">Ochish</button>
                            </div>
                            <div class="w-full h-64 bg-white rounded-xl overflow-hidden border border-slate-800">
                                <iframe id="browser-frame" src="https://wikipedia.org" class="w-full h-full"></iframe>
                            </div>
                        </div>
                    `;
                    break;

                case 'Musiqa':
                    iconEl.innerText = '🎵';
                    contentEl.innerHTML = `
                        <div class="flex flex-col items-center justify-center space-y-4 py-6">
                            <div class="w-24 h-24 rounded-full bg-slate-900 border border-sky-500/40 flex items-center justify-center text-4xl animate-pulse">
                                🎵
                            </div>
                            <p id="music-title" class="text-xs text-sky-300 font-bold">Musiqa tanlanmagan</p>
                            <button onclick="document.getElementById('music-input').click()" class="px-6 py-2.5 bg-sky-600 rounded-xl text-xs font-bold">Telefon xotirasidan yuklash 🎧</button>
                        </div>
                    `;
                    break;

                case 'Fayllar':
                    iconEl.innerText = '📁';
                    contentEl.innerHTML = `
                        <div class="flex flex-col space-y-3">
                            <button onclick="document.getElementById('file-input').click()" class="w-full py-3 bg-slate-900 border border-sky-500/30 rounded-xl text-xs font-bold text-sky-400">+ Yangi Fayl Qo'shish</button>
                            <div id="file-list" class="space-y-2">
                                <div class="p-2.5 bg-slate-900 rounded-xl border border-slate-800 flex justify-between text-xs">
                                    <span>📁 /system/storage/config.json</span>
                                    <span class="text-emerald-400">Himoyalangan</span>
                                </div>
                            </div>
                        </div>
                    `;
                    break;

                case 'Himoya':
                    iconEl.innerText = '🛡️';
                    contentEl.innerHTML = `
                        <div class="space-y-3">
                            <div class="p-3 bg-emerald-950/40 border border-emerald-500/30 rounded-xl text-center">
                                <p class="text-emerald-400 font-bold text-sm">BARQAROR VA HIMOYALANGAN</p>
                                <p class="text-[10px] text-slate-400 mt-1">Barcha tashqi tarmoqlar bloklangan.</p>
                            </div>
                            <div class="p-3 bg-slate-900 rounded-xl border border-slate-800 text-[10px] space-y-1">
                                <p>• Firewall: Aktiv (AES-256)</p>
                                <p>• Root Shield: Yoqilgan</p>
                                <p>• Secure Node: Farg'ona Campus Sync</p>
                            </div>
                        </div>
                    `;
                    break;

                case 'Bulut':
                    iconEl.innerText = '🗄️';
                    contentEl.innerHTML = `
                        <div class="space-y-3">
                            <div class="p-3 bg-slate-900 rounded-xl border border-slate-800">
                                <p class="text-xs font-bold text-sky-400">Cloud Pro Sinxronizatsiya</p>
                                <p class="text-[10px] text-slate-400 mt-1">C:\\BulutPapkasi va Telegram Bot API orqali uzluksiz arxivlash faol.</p>
                            </div>
                            <button onclick="alert('Sinxronizatsiya muvaffaqiyatli yakunlandi!')" class="w-full py-2.5 bg-sky-600 rounded-xl text-xs font-bold">Hozir Sinxronizatsiya qilish ⚡</button>
                        </div>
                    `;
                    break;

                case 'Terminal':
                    iconEl.innerText = '💻';
                    contentEl.innerHTML = `
                        <div class="space-y-2">
                            <div id="terminal-screen" class="bg-black p-3 rounded-xl border border-slate-800 text-[10px] h-44 overflow-y-auto font-mono text-green-400">
                                root@tox-system:~# systemctl status<br>
                                Kernel: Toxirjon-Core [OK]<br>
                                Storage: 128GB NVMe [OK]<br>
                                Type commands below...
                            </div>
                            <div class="flex space-x-2">
                                <input type="text" id="terminal-input" class="flex-1 bg-slate-900 border border-slate-800 px-3 py-2 rounded-xl text-xs text-white" placeholder="buyruq kiriting...">
                                <button onclick="runCommand()" class="px-4 bg-green-600 text-black font-bold rounded-xl text-xs">OK</button>
                            </div>
                        </div>
                    `;
                    break;

                case 'Temir':
                    iconEl.innerText = '📊';
                    contentEl.innerHTML = `
                        <div class="space-y-3">
                            <div class="p-3 bg-slate-900 rounded-xl border border-slate-800 space-y-2 text-xs">
                                <div class="flex justify-between"><span>Xotira (Storage):</span> <span class="text-sky-400">128 GB</span></div>
                                <div class="flex justify-between"><span>Platforma:</span> <span class="text-sky-400">Windows / Mobile Hybrid</span></div>
                                <div class="flex justify-between"><span>Batareya Holati:</span> <span id="sys-battery" class="text-emerald-400">Yuklanmoqda...</span></div>
                                <div class="flex justify-between"><span>CPU Status:</span> <span class="text-emerald-400">Optimal (0.8 GHz)</span></div>
                            </div>
                        </div>
                    `;
                    if ('getBattery' in navigator) {
                        navigator.getBattery().then(b => {
                            document.getElementById('sys-battery').innerText = Math.round(b.level * 100) + '%';
                        });
                    }
                    break;

                case 'Sozlamalar':
                    iconEl.innerText = '⚙️';
                    contentEl.innerHTML = `
                        <div class="space-y-3 text-xs">
                            <div class="p-3 bg-slate-900 rounded-xl border border-slate-800 space-y-1">
                                <p class="font-bold text-sky-400">Tox-System v1.0</p>
                                <p class="text-slate-400">Egasi: Fattoxov Abdulloh Toxirjon o'g'li</p>
                                <p class="text-slate-400">O'quv maskani: Toshkent Menejment va Iqtisodiyot Instituti</p>
                            </div>

                            <!-- Haqiqiy boshqaruv funksiyalari -->
                            <div class="p-3 bg-slate-900 rounded-xl border border-slate-800 space-y-3">
                                <p class="font-bold text-sky-300">Tizim Boshqaruvi</p>
                                
                                <div class="flex justify-between items-center">
                                    <span>Wi-Fi Moduli:</span>
                                    <button onclick="toggleWifi()" id="wifi-btn" class="px-3 py-1 bg-emerald-600 rounded-lg text-white font-bold">Yoqilgan</button>
                                </div>

                                <div class="flex justify-between items-center">
                                    <span>To'liq Ekran:</span>
                                    <button onclick="toggleFullScreen()" class="px-3 py-1 bg-sky-600 rounded-lg text-white font-bold">Faollashtirish</button>
                                </div>

                                <div class="space-y-1">
                                    <div class="flex justify-between">
                                        <span>Ekran Yorqinligi:</span>
                                        <span id="bright-val">100%</span>
                                    </div>
                                    <input type="range" min="10" max="100" value="100" class="w-full accent-sky-500" oninput="changeBrightness(this.value)">
                                </div>
                            </div>

                            <button onclick="clearSystemCache()" class="w-full py-2.5 bg-red-600/80 rounded-xl font-bold text-white">Tizim Keshini Tozalash 🗑️</button>
                        </div>
                    `;
                    break;
            }
        }

        // Sozlamalar ichidagi funksiyalar
        let wifiActive = true;
        function toggleWifi() {
            wifiActive = !wifiActive;
            const btn = document.getElementById('wifi-btn');
            if(wifiActive) {
                btn.innerText = 'Yoqilgan';
                btn.className = 'px-3 py-1 bg-emerald-600 rounded-lg text-white font-bold';
            } else {
                btn.innerText = 'O\'chirilgan';
                btn.className = 'px-3 py-1 bg-red-600 rounded-lg text-white font-bold';
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert('To\'liq ekranga o\'tishda xatolik: ' + err.message);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function changeBrightness(val) {
            document.getElementById('bright-val').innerText = val + '%';
            const overlay = document.getElementById('brightness-overlay');
            const opacity = (100 - val) / 100 * 0.85; // qoraytirish darajasi
            overlay.style.opacity = opacity;
        }

        function clearSystemCache() {
            localStorage.clear();
            alert('Tizim keshi muvaffaqiyatli tozalandi va barcha parametrlar qayta yuklandi!');
        }

        // Aloqa funksiyasi
        let phoneNum = "";
        function pressNum(n) {
            phoneNum += n;
            document.getElementById('phone-number').value = phoneNum;
        }
        function makeCall() {
            if(phoneNum) window.location.href = `tel:${phoneNum}`;
            else alert('Raqam kiritilmadi!');
        }

        // Xabar funksiyasi
        function sendSms() {
            const text = document.getElementById('sms-text').value;
            if(text) {
                window.location.href = `sms:?body=${encodeURIComponent(text)}`;
            } else {
                alert('Xabar matni bo\'sh!');
            }
        }

        // Kamera yoqish
        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                .then(stream => {
                    videoStream = stream;
                    const video = document.getElementById('video');
                    if(video) video.srcObject = stream;
                })
                .catch(err => {
                    console.error(err);
                });
        }

        // Brauzer ochish
        function loadWeb() {
            const url = document.getElementById('browser-url').value;
            document.getElementById('browser-frame').src = url;
        }

        // Fayl yuklash
        function loadUploadedFile(input) {
            if(input.files.length > 0) {
                const file = input.files[0];
                const fileList = document.getElementById('file-list');
                if(fileList) {
                    fileList.innerHTML += `
                        <div class="p-2.5 bg-slate-900 rounded-xl border border-slate-800 flex justify-between text-xs mt-2">
                            <span>📁 ${file.name}</span>
                            <span class="text-sky-400">${Math.round(file.size/1024)} KB</span>
                        </div>
                    `;
                }
                const galleryGrid = document.getElementById('gallery-grid');
                if(galleryGrid && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = e => {
                        galleryGrid.innerHTML += `<img src="${e.target.result}" class="w-full h-24 object-cover rounded-xl border border-sky-500/30">`;
                    };
                    reader.readAsDataURL(file);
                }
            }
        }

        // Musiqa ijro etish
        function loadMusicFile(input) {
            if(input.files.length > 0) {
                const file = input.files[0];
                document.getElementById('music-title').innerText = file.name;
                if(audioPlayer) audioPlayer.pause();
                audioPlayer = new Audio(URL.createObjectURL(file));
                audioPlayer.play();
                alert('Musiqa ijro etilmoqda: ' + file.name);
            }
        }

        // Terminal buyruqlari
        function runCommand() {
            const input = document.getElementById('terminal-input');
            const screen = document.getElementById('terminal-screen');
            const val = input.value.trim();
            if(val) {
                screen.innerHTML += `<br>root@tox-system:~# ${val}<br><span class="text-white">Bajarildi: ${val} - OK</span>`;
                input.value = '';
                screen.scrollTop = screen.scrollHeight;
            }
        }
    </script>
</body>
</html>
