<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tox-System | Shaxsiy Ekotizim</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col justify-between p-4 select-none">

    <!-- Yuqori panel (Status bar) -->
    <div class="flex justify-between items-center text-xs text-slate-400 px-2 py-1 bg-slate-900/80 rounded-xl backdrop-blur">
        <span id="clock">00:00</span>
        <span class="font-bold tracking-wider text-sky-400">TOX-SYSTEM</span>
        <span>100% 🔋</span>
    </div>

    <!-- Asosiy ish stoli (Desktop / UI) -->
    <div class="flex flex-col items-center justify-center flex-1 text-center">
        <div class="w-24 h-24 bg-sky-600 rounded-3xl flex items-center justify-center text-4xl shadow-lg shadow-sky-500/30 mb-4 animate-pulse">
            ⚡
        </div>
        <h1 class="text-2xl font-bold mb-1">Tox-System</h1>
        <p class="text-slate-400 text-sm max-w-xs mb-6">Mustaqil xususiy yadro faol. Barcha ma'lumotlar nazorat ostida.</p>
        
        <button onclick="openSystem()" class="bg-sky-500 hover:bg-sky-600 text-white font-semibold px-6 py-3 rounded-2xl shadow-lg shadow-sky-500/25 transition active:scale-95">
            Tizimni Boshqarish
        </button>
    </div>

    <!-- Pastki menyu paneli (Dock) -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 flex justify-around items-center">
        <button onclick="alert('Bosh sahifa')" class="text-2xl">🏠</button>
        <button onclick="alert('Fayllar va Ma\'lumotlar')" class="text-2xl">📁</button>
        <button onclick="alert('Xavfsizlik markazi')" class="text-2xl">🛡️</button>
        <button onclick="alert('Sozlamalar')" class="text-2xl">⚙️</button>
    </div>

    <script>
        // Soatni yangilab turish
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        function openSystem() {
            alert("Tox-System xususiy markaziga xush kelibsiz!");
        }
    </script>
</body>
</html>
