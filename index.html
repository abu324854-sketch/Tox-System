<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tox-System Sovereign Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #010409;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
        }
        .tox-glass {
            background: rgba(3, 7, 18, 0.9);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(14, 165, 233, 0.25);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.05);
        }
        .core-pulse {
            animation: pulse-ring 3s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(14, 165, 233, 0); }
            100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
        }
        #app-window {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }
        #app-window.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="text-white h-screen flex flex-col justify-between p-4 select-none relative">

    <!-- Yuqori Status Paneli (Standart emas, maxfiy chastota uslubida) -->
    <div class="tox-glass flex justify-between items-center text-xs text-sky-400 px-4 py-2.5 rounded-xl z-30">
        <span id="clock" class="font-mono">00:00:00</span>
        <span class="tracking-widest font-black">TOXIRJON // KERNEL_ACTIVE</span>
        <span id="battery" class="font-mono">--% ⚡</span>
    </div>

    <!-- Asosiy Noyob Markaz (Android/iOS ga o'xshamaydigan interfeys) -->
    <div class="flex-1 flex flex-col justify-center items-center px-2 z-10">
        <!-- Markaziy Yadro (Core Visualizer) -->
        <div onclick="openApp('Tox Core', '⚡', 'Toxirjon Core — mustaqil xususiy yadro. Tashqi tarmoqlardan to\'la ajratilgan va shifrlangan.')" class="core-pulse w-32 h-32 rounded-full tox-glass flex flex-col items-center justify-center cursor-pointer mb-8 transition hover:scale-105">
            <span class="text-4xl mb-1">🛡️</span>
            <span class="text-[10px] tracking-widest text-sky-300 font-bold">TOX-CORE</span>
        </div>

        <!-- Modullar paneli (Grid o'rniga xususiy tarmoq tugmalari) -->
        <div class="grid grid-cols-3 gap-3 w-full max-w-sm">
            <div onclick="openApp('Aloqa Markazi', '📞', 'Xususiy shifrlangan aloqa kanallari faol.')" class="tox-glass p-3 rounded-xl text-center cursor-pointer hover:border-sky-400 transition">
                <span class="text-lg">📞</span>
                <p class="text-[9px] text-slate-400 mt-1 uppercase">Aloqa</p>
            </div>
            <div onclick="openApp('Xabarlar', '💬', 'Nolinchi darajali shifrlangan xabarlar uzatish.')" class="tox-glass p-3 rounded-xl text-center cursor-pointer hover:border-sky-400 transition">
                <span class="text-lg">💬</span>
                <p class="text-[9px] text-slate-400 mt-1 uppercase">Xabar</p>
            </div>
            <div onclick="openApp('Optik Sensor', '📷', 'Tizim tomonidan boshqariladigan kamera va optika.')" class="tox-glass p-3 rounded-xl text-center cursor-pointer hover:border-sky-400 transition">
                <span class="text-lg">📷</span>
                <p class="text-[9px] text-slate-400 mt-1 uppercase">Optika</p>
            </div>
            <div onclick="openApp('Shifrlangan Ombor', '🗄️', 'C:\\BulutPapkasi va mahalliy xotira sinxronizatsiyasi.')" class="tox-glass p-3 rounded-xl text-center cursor-pointer hover:border-sky-400 transition">
                <span class="text-lg">🗄️</span>
                <p class="text-[9px] text-slate-400 mt-1 uppercase">Bulut</p>
            </div>
            <div onclick="openApp('Terminal', '💻', 'root@tox-system:~# systemctl start sovereign-mode')" class="tox-glass p-3 rounded-xl text-center cursor-pointer hover:border-sky-400 transition">
                <span class="text-lg">💻</span>
                <p class="text-[9px] text-slate-400 mt-1 uppercase">Terminal</p>
            </div>
            <div onclick="openApp('Tizim Sozlamalari', '⚙️', 'Muallif: Fattoxov Abdulloh. Toxirjon Core arxitekturasi.')" class="tox-glass p-3 rounded-xl text-center cursor-pointer hover:border-sky-400 transition">
                <span class="text-lg">⚙️</span>
                <p class="text-[9px] text-slate-400 mt-1 uppercase">Sozlama</p>
            </div>
        </div>
    </div>

    <!-- Pastdan qalqib chiquvchi to'liq ekran modul oynasi -->
    <div id="app-window" class="absolute inset-x-2 bottom-2 top-16 tox-glass rounded-2xl p-6 flex flex-col justify-between z-20 shadow-2xl border border-sky-500/40">
        <div>
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                <div class="flex items-center space-x-3">
                    <span id="app-icon-lg" class="text-2xl">⚡</span>
                    <h2 id="app-title-lg" class="text-sm font-bold tracking-wider text-sky-400">MODUL</h2>
                </div>
                <button onclick="closeApp()" class="text-slate-400 hover:text-white text-xs px-3 py-1 rounded bg-slate-900 border border-slate-800">[YOPISH]</button>
            </div>
            <div id="app-content-lg" class="text-xs text-slate-300 font-mono leading-relaxed whitespace-pre-line">
                Ma'lumotlar yuklanmoqda...
            </div>
        </div>
        <div class="text-center text-[9px] text-slate-600 font-mono tracking-widest">
            TOX-SYSTEM // SOVEREIGN ARCHITECTURE
        </div>
    </div>

    <!-- Pastki minimalist boshqaruv paneli -->
    <div class="tox-glass rounded-xl p-3 flex justify-around items-center z-10">
        <button onclick="closeApp()" class="text-sm tracking-widest text-sky-400">◆ YADRO</button>
        <button onclick="openApp('Terminal', '💻', 'root@tox-system:~# status')" class="text-sm tracking-widest text-slate-400">◆ BUYRUQ</button>
        <button onclick="openApp('Tizim Sozlamalari', '⚙️', 'Xususiy muhit faol.')" class="text-sm tracking-widest text-slate-400">◆ XAVFSIZLIK</button>
    </div>

    <script>
        // Aniq vaqt (sekundlar bilan)
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        // Batareya
        if ('getBattery' in navigator) {
            navigator.getBattery().then(b => {
                document.getElementById('battery').innerText = Math.round(b.level * 100) + '% ⚡';
            });
        } else {
            document.getElementById('battery').innerText = '100% ⚡';
        }

        function openApp(name, icon, content) {
            document.getElementById('app-title-lg').innerText = name.toUpperCase();
            document.getElementById('app-icon-lg').innerText = icon;
            document.getElementById('app-content-lg').innerText = content;
            document.getElementById('app-window').classList.add('active');
        }

        function closeApp() {
            document.getElementById('app-window').classList.remove('active');
        }
    </script>
</body>
</html>
