<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tox-OS // Sovereign Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PWA sozlamalari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tox-OS">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#05080f">
    
    <style>
        body {
            background: #05080f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        .phone-frame {
            background: radial-gradient(circle at top, #111827 0%, #030712 100%);
            border: 10px solid #1f2937;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .glass-dock {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .app-glass {
            background: rgba(13, 18, 30, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .app-icon:active {
            transform: scale(0.88);
        }
        #app-window {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(0.9) translateY(40px);
            opacity: 0;
            pointer-events: none;
        }
        #app-window.active {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        #brightness-overlay {
            position: fixed;
            inset: 0;
            background: black;
            pointer-events: none;
            opacity: 0;
            z-index: 999;
            transition: opacity 0.2s ease;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-0 md:p-4 select-none">

    <!-- Yorqinlik pardasi -->
    <div id="brightness-overlay"></div>

    <!-- Smartfon Ekran Konteyneri -->
    <div class="phone-frame w-full h-full md:max-w-[400px] md:max-h-[820px] md:rounded-[40px] flex flex-col justify-between relative overflow-hidden text-white">

        <!-- Status Bar -->
        <div class="px-5 pt-3 pb-2 flex justify-between items-center text-xs font-semibold text-slate-200 z-30">
            <span id="clock" class="font-mono">00:00</span>
            <div class="w-20 h-4 bg-black rounded-full mx-auto flex items-center justify-center">
                <div class="w-2 h-2 rounded-full bg-slate-900 border border-slate-800"></div>
            </div>
            <div class="flex items-center space-x-2 font-mono">
                <span>📶</span>
                <span id="battery">100%</span>
            </div>
        </div>

        <!-- Asosiy Ishchi Stol -->
        <div class="flex-1 flex flex-col px-4 pt-2 pb-4 overflow-y-auto z-10 space-y-4">
            
            <!-- Vidjet va O'rnatish tugmasi -->
            <div class="app-glass rounded-2xl p-3.5 flex justify-between items-center shadow-lg">
                <div>
                    <h2 class="text-xs font-bold text-sky-400">Tox-OS v2.5</h2>
                    <p class="text-[10px] text-slate-400">Sovereign Mobile Environment</p>
                </div>
                <button id="install-btn" onclick="installApp()" class="hidden px-3 py-1.5 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-xl text-[10px] shadow-lg animate-pulse">
                    📥 O'rnatish
                </button>
            </div>

            <!-- Tizim Ilovalari Grid Paneli -->
            <div class="grid grid-cols-4 gap-4 pt-1">
                <div onclick="openApp('Telefon')" class="app-icon flex flex-col items-center cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-xl shadow-md mb-1">📞</div>
                    <span class="text-[10px] text-slate-300 font-medium">Telefon</span>
                </div>
                <div onclick="openApp('Xabarlar')" class="app-icon flex flex-col items-center cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-500 to-sky-400 flex items-center justify-center text-xl shadow-md mb-1">💬</div>
                    <span class="text-[10px] text-slate-300 font-medium">Xabarlar</span>
                </div>
                <div onclick="openApp('Kamera')" class="app-icon flex flex-col items-center cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-slate-700 to-slate-800 border border-slate-600 flex items-center justify-center text-xl shadow-md mb-1">📷</div>
                    <span class="text-[10px] text-slate-300 font-medium">Kamera</span>
                </div>
                <div onclick="openApp('Galereya')" class="app-icon flex flex-col items-center cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center text-xl shadow-md mb-1">🖼️</div>
                    <span class="text-[10px] text-slate-300 font-medium">Galereya</span>
                </div>
                <div onclick="openApp('Brauzer')" class="app-icon flex flex-col items-center cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-xl shadow-md mb-1">🌐</div>
                    <span class="text-[10px] text-slate-300 font-medium">Brauzer</span>
                </div>
                <div onclick="openApp('Musiqa')" class="app-icon flex flex-col items-center cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-500 flex items-center justify-center text-xl shadow-md mb-1">🎵</div>
                    <span class="text-[10px] text-slate-300 font-medium">Musiqa</span>
                </div>
                <div onclick="openApp('Fayllar')" class="app-icon flex flex-col items-center cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-yellow-500 to-amber-600 flex items-center justify-center text-xl shadow-md mb-1">📁</div>
                    <span class="text-[10px] text-slate-300 font-medium">Fayllar</span>
                </div>
                <div onclick="openApp('Kalkulyator')" class="app-icon flex flex-col items-center cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-orange-600 to-amber-700 flex items-center justify-center text-xl shadow-md mb-1">🔢</div>
                    <span class="text-[10px] text-slate-300 font-medium">Hisoblagich</span>
                </div>
                <div onclick="openApp('Eslatmalar')" class="app-icon flex flex-col items-center cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-yellow-400 to-amber-500 flex items-center justify-center text-xl shadow-md mb-1">📝</div>
                    <span class="text-[10px] text-slate-300 font-medium">Eslatmalar</span>
                </div>
                <div onclick="openApp('Soat')" class="app-icon flex flex-col items-center cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-stone-700 to-zinc-900 flex items-center justify-center text-xl shadow-md mb-1">⏰</div>
                    <span class="text-[10px] text-slate-300 font-medium">Soat</span>
                </div>
                <div onclick="openApp('Bulut')" class="app-icon flex flex-col items-center cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-600 to-blue-700 flex items-center justify-center text-xl shadow-md mb-1">☁️</div>
                    <span class="text-[10px] text-slate-300 font-medium">Bulut Pro</span>
                </div>
                <div onclick="openApp('Himoya')" class="app-icon flex flex-col items-center cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 to-green-800 flex items-center justify-center text-xl shadow-md mb-1">🛡️</div>
                    <span class="text-[10px] text-slate-300 font-medium">Himoya</span>
                </div>
                <div onclick="openApp('Terminal')" class="app-icon flex flex-col items-center cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-neutral-900 to-black border border-neutral-700 flex items-center justify-center text-xl shadow-md mb-1">💻</div>
                    <span class="text-[10px] text-slate-300 font-medium">Terminal</span>
                </div>
                <div onclick="openApp('Temir')" class="app-icon flex flex-col items-center cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-700 flex items-center justify-center text-xl shadow-md mb-1">📊</div>
                    <span class="text-[10px] text-slate-300 font-medium">Tizim</span>
                </div>
                <div onclick="openApp('Sozlamalar')" class="app-icon flex flex-col items-center cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-slate-600 to-slate-800 flex items-center justify-center text-xl shadow-md mb-1">⚙️</div>
                    <span class="text-[10px] text-slate-300 font-medium">Sozlama</span>
                </div>
            </div>
        </div>

        <!-- Fayl va Musiqa uchun yashirin inputlar -->
        <input type="file" id="file-input" class="hidden" onchange="loadUploadedFile(this)">
        <input type="file" id="music-input" accept="audio/*" class="hidden" onchange="loadMusicFile(this)">

        <!-- Ilova Oynasi -->
        <div id="app-window" class="absolute inset-x-2 top-12 bottom-16 app-glass rounded-3xl p-4 flex flex-col justify-between z-20 shadow-2xl border border-sky-500/20">
            <div class="flex flex-col h-full">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-3">
                    <div class="flex items-center space-x-2">
                        <span id="app-icon-lg" class="text-lg">⚡</span>
                        <h3 id="app-title-lg" class="text-xs font-bold tracking-wide text-sky-400 uppercase">MODUL</h3>
                    </div>
                    <button onclick="closeApp()" class="w-7 h-7 rounded-full bg-slate-800/80 flex items-center justify-center text-slate-300 hover:text-white text-xs font-bold">✕</button>
                </div>
                <div id="app-content-lg" class="flex-1 overflow-y-auto text-xs text-slate-200 font-mono pr-1">
                    Yuklanmoqda...
                </div>
            </div>
        </div>

        <!-- Pastki Dock Paneli -->
        <div class="glass-dock px-6 py-3 flex justify-around items-center z-10">
            <div onclick="openApp('Telefon')" class="app-icon w-11 h-11 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-lg cursor-pointer shadow-md">📞</div>
            <div onclick="openApp('Xabarlar')" class="app-icon w-11 h-11 rounded-2xl bg-gradient-to-tr from-blue-500 to-sky-400 flex items-center justify-center text-lg cursor-pointer shadow-md">💬</div>
            <div onclick="openApp('Brauzer')" class="app-icon w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-lg cursor-pointer shadow-md">🌐</div>
            <div onclick="openApp('Sozlamalar')" class="app-icon w-11 h-11 rounded-2xl bg-gradient-to-tr from-slate-600 to-slate-800 flex items-center justify-center text-lg cursor-pointer shadow-md">⚙️</div>
        </div>

    </div>

    <script>
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-btn').classList.remove('hidden');
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('Ilova o\'rnatildi');
                    }
                    deferredPrompt = null;
                    document.getElementById('install-btn').classList.add('hidden');
                });
            } else {
                alert("Ilova allaqachon o'rnatilgan yoki brauzeringiz qo'llab-quvvatlaydi.");
            }
        }

        const manifestData = {
            "name": "Tox-OS Sovereign Mobile",
            "short_name": "Tox-OS",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#05080f",
            "theme_color": "#05080f",
            "icons": [{ "src": "https://img.icons8.com/fluency/192/source-code.png", "sizes": "192x192", "type": "image/png" }]
        };
        const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript;base64,' + btoa(`
                self.addEventListener('install', e => { e.waitUntil(self.skipWaiting()); });
                self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
                self.addEventListener('fetch', e => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
            `)).catch(err => {});
        }

        let videoStream = null;
        let audioPlayer = null;

        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toTimeString().split(':').slice(0,2).join(':');
        }, 1000);

        if ('getBattery' in navigator) {
            navigator.getBattery().then(b => {
                document.getElementById('battery').innerText = Math.round(b.level * 100) + '%';
            });
        }

        function closeApp() {
            stopCamera();
            if(audioPlayer) { audioPlayer.pause(); audioPlayer = null; }
            document.getElementById('app-window').classList.remove('active');
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
            }
        }

        function openApp(appName) {
            stopCamera();
            if(audioPlayer && appName !== 'Musiqa') { audioPlayer.pause(); audioPlayer = null; }

            const titleEl = document.getElementById('app-title-lg');
            const iconEl = document.getElementById('app-icon-lg');
            const contentEl = document.getElementById('app-content-lg');

            titleEl.innerText = appName;
            document.getElementById('app-window').classList.add('active');

            switch(appName) {
                case 'Telefon':
                    iconEl.innerText = '📞';
                    contentEl.innerHTML = `
                        <div class="flex flex-col items-center space-y-3 h-full justify-between pb-2">
                            <input type="text" id="phone-number" readonly class="w-full bg-slate-900/90 border border-slate-700 text-center text-xl p-3 rounded-2xl font-mono text-emerald-400 tracking-wider" placeholder="+998 ...">
                            <div class="grid grid-cols-3 gap-2.5 w-full">
                                <button onclick="pressNum('1')" class="py-3 bg-slate-900/80 rounded-2xl font-bold border border-slate-800 text-base">1</button>
                                <button onclick="pressNum('2')" class="py-3 bg-slate-900/80 rounded-2xl font-bold border border-slate-800 text-base">2</button>
                                <button onclick="pressNum('3')" class="py-3 bg-slate-900/80 rounded-2xl font-bold border border-slate-800 text-base">3</button>
                                <button onclick="pressNum('4')" class="py-3 bg-slate-900/80 rounded-2xl font-bold border border-slate-800 text-base">4</button>
                                <button onclick="pressNum('5')" class="py-3 bg-slate-900/80 rounded-2xl font-bold border border-slate-800 text-base">5</button>
                                <button onclick="pressNum('6')" class="py-3 bg-slate-900/80 rounded-2xl font-bold border border-slate-800 text-base">6</button>
                                <button onclick="pressNum('7')" class="py-3 bg-slate-900/80 rounded-2xl font-bold border border-slate-800 text-base">7</button>
                                <button onclick="pressNum('8')" class="py-3 bg-slate-900/80 rounded-2xl font-bold border border-slate-800 text-base">8</button>
                                <button onclick="pressNum('9')" class="py-3 bg-slate-900/80 rounded-2xl font-bold border border-slate-800 text-base">9</button>
                                <button onclick="pressNum('*')" class="py-3 bg-slate-900/80 rounded-2xl font-bold border border-slate-800 text-base">*</button>
                                <button onclick="pressNum('0')" class="py-3 bg-slate-900/80 rounded-2xl font-bold border border-slate-800 text-base">0</button>
                                <button onclick="pressNum('#')" class="py-3 bg-slate-900/80 rounded-2xl font-bold border border-slate-800 text-base">#</button>
                            </div>
                            <button onclick="makeCall()" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 rounded-2xl font-bold text-slate-950 text-sm shadow-lg">Qo'ng'iroq qilish 📞</button>
                        </div>
                    `;
                    break;

                case 'Xabarlar':
                    iconEl.innerText = '💬';
                    contentEl.innerHTML = `
                        <div class="flex flex-col space-y-3">
                            <div class="p-3 bg-slate-900/80 rounded-2xl border border-slate-800">
                                <p class="text-[10px] text-sky-400 font-bold">Tox-Secure Messenger</p>
                                <p class="text-xs text-slate-300 mt-1">Shifrlangan xavfsiz kanallar faol.</p>
                            </div>
                            <textarea id="sms-text" rows="4" class="w-full bg-slate-900/80 border border-slate-700 p-3 rounded-2xl text-white text-xs outline-none" placeholder="Xabar yozing..."></textarea>
                            <button onclick="sendSms()" class="w-full py-3 bg-sky-500 rounded-2xl font-bold text-slate-950 text-xs">Yuborish 💬</button>
                        </div>
                    `;
                    break;

                case 'Kamera':
                    iconEl.innerText = '📷';
                    contentEl.innerHTML = `
                        <div class="flex flex-col items-center space-y-3">
                            <video id="video" autoplay playsinline class="w-full h-64 object-cover rounded-2xl border border-slate-700"></video>
                            <p class="text-[10px] text-slate-400">Optik sensor ishlamoqda.</p>
                        </div>
                    `;
                    startCamera();
                    break;

                case 'Galereya':
                    iconEl.innerText = '🖼️';
                    contentEl.innerHTML = `
                        <div class="flex flex-col space-y-3">
                            <div class="p-5 border-2 border-dashed border-slate-700 rounded-2xl text-center cursor-pointer" onclick="document.getElementById('file-input').click()">
                                <span class="text-2xl">📥</span>
                                <p class="text-[11px] text-slate-400 mt-1">Rasm yuklash</p>
                            </div>
                            <div id="gallery-grid" class="grid grid-cols-2 gap-2"></div>
                        </div>
                    `;
                    break;

                case 'Brauzer':
                    iconEl.innerText = '🌐';
                    contentEl.innerHTML = `
                        <div class="flex flex-col space-y-2 h-full">
                            <div class="flex space-x-2">
                                <input type="text" id="browser-url" value="https://wikipedia.org" class="flex-1 bg-slate-900 border border-slate-700 px-3 py-2 rounded-xl text-xs text-white outline-none">
                                <button onclick="loadWeb()" class="px-3 bg-indigo-600 rounded-xl text-xs font-bold">Ochish</button>
                            </div>
                            <div class="flex-1 w-full bg-white rounded-2xl overflow-hidden border border-slate-800 min-h-[260px]">
                                <iframe id="browser-frame" src="https://wikipedia.org" class="w-full h-full"></iframe>
                            </div>
                        </div>
                    `;
                    break;

                case 'Musiqa':
                    iconEl.innerText = '🎵';
                    contentEl.innerHTML = `
                        <div class="flex flex-col items-center justify-center space-y-4 py-8">
                            <div class="w-28 h-28 rounded-full bg-slate-900 border border-pink-500/30 flex items-center justify-center text-4xl shadow-xl animate-pulse">🎵</div>
                            <p id="music-title" class="text-xs text-pink-400 font-bold text-center">Musiqa tanlanmagan</p>
                            <button onclick="document.getElementById('music-input').click()" class="px-5 py-2.5 bg-pink-600 rounded-2xl text-xs font-bold text-white shadow-lg">Fayldan tanlash 🎧</button>
                        </div>
                    `;
                    break;

                case 'Fayllar':
                    iconEl.innerText = '📁';
                    contentEl.innerHTML = `
                        <div class="flex flex-col space-y-2">
                            <button onclick="document.getElementById('file-input').click()" class="w-full py-2.5 bg-slate-900 border border-slate-700 rounded-2xl text-xs font-bold text-amber-400">+ Yangi Fayl Qo'shish</button>
                            <div id="file-list" class="space-y-2">
                                <div class="p-2.5 bg-slate-900 rounded-xl border border-slate-800 flex justify-between text-xs">
                                    <span>📁 system_config.json</span>
                                    <span class="text-emerald-400">Himoyalangan</span>
                                </div>
                            </div>
                        </div>
                    `;
                    break;

                case 'Kalkulyator':
                    iconEl.innerText = '🔢';
                    contentEl.innerHTML = `
                        <div class="flex flex-col space-y-3 h-full justify-between">
                            <input type="text" id="calc-screen" readonly class="w-full bg-slate-900 border border-slate-700 text-right text-xl p-3 rounded-2xl font-mono text-white" value="0">
                            <div class="grid grid-cols-4 gap-2">
                                <button onclick="calcClear()" class="p-3 bg-red-950/60 text-red-400 rounded-xl font-bold">C</button>
                                <button onclick="calcAppend('/')" class="p-3 bg-slate-800 rounded-xl font-bold">/</button>
                                <button onclick="calcAppend('*')" class="p-3 bg-slate-800 rounded-xl font-bold">*</button>
                                <button onclick="calcAppend('-')" class="p-3 bg-slate-800 rounded-xl font-bold">-</button>
                                <button onclick="calcAppend('7')" class="p-3 bg-slate-900 rounded-xl font-bold">7</button>
                                <button onclick="calcAppend('8')" class="p-3 bg-slate-900 rounded-xl font-bold">8</button>
                                <button onclick="calcAppend('9')" class="p-3 bg-slate-900 rounded-xl font-bold">9</button>
                                <button onclick="calcAppend('+')" class="p-3 bg-slate-800 rounded-xl font-bold">+</button>
                                <button onclick="calcAppend('4')" class="p-3 bg-slate-900 rounded-xl font-bold">4</button>
                                <button onclick="calcAppend('5')" class="p-3 bg-slate-900 rounded-xl font-bold">5</button>
                                <button onclick="calcAppend('6')" class="p-3 bg-slate-900 rounded-xl font-bold">6</button>
                                <button onclick="calcEval()" class="p-3 bg-orange-600 rounded-xl font-bold row-span-2 flex items-center justify-center">=</button>
                                <button onclick="calcAppend('1')" class="p-3 bg-slate-900 rounded-xl font-bold">1</button>
                                <button onclick="calcAppend('2')" class="p-3 bg-slate-900 rounded-xl font-bold">2</button>
                                <button onclick="calcAppend('3')" class="p-3 bg-slate-900 rounded-xl font-bold">3</button>
                                <button onclick="calcAppend('0')" class="p-3 bg-slate-900 rounded-xl font-bold col-span-2">0</button>
                                <button onclick="calcAppend('.')" class="p-3 bg-slate-900 rounded-xl font-bold">.</button>
                            </div>
                        </div>
                    `;
                    break;

                case 'Eslatmalar':
                    iconEl.innerText = '📝';
                    contentEl.innerHTML = `
                        <div class="flex flex-col space-y-3 h-full">
                            <textarea id="notes-text" class="flex-1 w-full bg-slate-900 border border-slate-700 p-3 rounded-2xl text-white text-xs outline-none" placeholder="Eslatmalaringizni shu yerga yozing..."></textarea>
                            <button onclick="alert('Eslatma saqlandi!')" class="py-2.5 bg-amber-500 font-bold text-slate-950 rounded-2xl text-xs">Saqlash</button>
                        </div>
                    `;
                    break;

                case 'Soat':
                    iconEl.innerText = '⏰';
                    contentEl.innerHTML = `
                        <div class="flex flex-col items-center justify-center space-y-4 py-8">
                            <div id="big-clock" class="text-4xl font-mono font-bold text-sky-400">00:00:00</div>
                            <p class="text-xs text-slate-400">Budilnik va Taymer tizimi tayyor.</p>
                            <button onclick="alert('Budilnik o\'rnatildi!')" class="px-5 py-2.5 bg-stone-700 rounded-2xl text-xs font-bold">Budilnik qo'shish ⏰</button>
                        </div>
                    `;
                    break;

                case 'Bulut':
                    iconEl.innerText = '☁️';
                    contentEl.innerHTML = `
                        <div class="space-y-3">
                            <div class="p-3 bg-slate-900 rounded-2xl border border-slate-800">
                                <p class="text-xs font-bold text-sky-400">Cloud Pro Sinxronizatsiya</p>
                                <p class="text-[10px] text-slate-400 mt-1">Ma'lumotlar shifrlangan holda saqlanmoqda.</p>
                            </div>
                            <button onclick="alert('Sinxronizatsiya muvaffaqiyatli yakunlandi!')" class="w-full py-2.5 bg-cyan-600 rounded-2xl text-xs font-bold text-white">Sinxronizatsiya qilish ⚡</button>
                        </div>
                    `;
                    break;

                case 'Himoya':
                    iconEl.innerText = '🛡️';
                    contentEl.innerHTML = `
                        <div class="space-y-3">
                            <div class="p-3 bg-emerald-950/50 border border-emerald-500/30 rounded-2xl text-center">
                                <p class="text-emerald-400 font-bold text-xs">TIZIM HIMOYALANGAN</p>
                                <p class="text-[10px] text-slate-400 mt-1">Barcha xavfsizlik protokollari faol.</p>
                            </div>
                            <div class="p-3 bg-slate-900 rounded-2xl border border-slate-800 text-[10px] space-y-1">
                                <p>• Firewall: Aktiv</p>
                                <p>• Shifrlash: AES-256</p>
                                <p>• Root Holati: Himoyalangan</p>
                            </div>
                        </div>
                    `;
                    break;

                case 'Terminal':
                    iconEl.innerText = '💻';
                    contentEl.innerHTML = `
                        <div class="space-y-2 h-full flex flex-col">
                            <div id="terminal-screen" class="flex-1 bg-black p-3 rounded-2xl border border-slate-800 text-[10px] overflow-y-auto font-mono text-green-400">
                                root@tox-os:~# systemctl status<br>
                                Kernel: Sovereign-Core [OK]<br>
                                Status: Mobil PWA Tayyor<br>
                            </div>
                            <div class="flex space-x-2">
                                <input type="text" id="terminal-input" class="flex-1 bg-slate-900 border border-slate-800 px-3 py-2 rounded-xl text-xs text-white outline-none" placeholder="buyruq...">
                                <button onclick="runCommand()" class="px-3 bg-green-600 text-black font-bold rounded-xl text-xs">OK</button>
                            </div>
                        </div>
                    `;
                    break;

                case 'Temir':
                    iconEl.innerText = '📊';
                    contentEl.innerHTML = `
                        <div class="space-y-3">
                            <div class="p-3 bg-slate-900 rounded-2xl border border-slate-800 space-y-2 text-xs">
                                <div class="flex justify-between"><span>Xotira (Storage):</span> <span class="text-sky-400">128 GB</span></div>
                                <div class="flex justify-between"><span>Tarmoq:</span> <span id="net-status" class="text-emerald-400">Online</span></div>
                                <div class="flex justify-between"><span>Platforma:</span> <span class="text-emerald-400">PWA Mobile</span></div>
                            </div>
                        </div>
                    `;
                    break;

                case 'Sozlamalar':
                    iconEl.innerText = '⚙️';
                    contentEl.innerHTML = `
                        <div class="space-y-3 text-xs">
                            <div class="p-3 bg-slate-900 rounded-2xl border border-slate-800 space-y-1">
                                <p class="font-bold text-sky-400">Tox-OS Mobile v2.5</p>
                                <p class="text-slate-400 text-[10px]">Egasining shaxsiy mobil muhiti</p>
                            </div>
                            <div class="p-3 bg-slate-900 rounded-2xl border border-slate-800 space-y-3">
                                <div class="flex justify-between items-center">
                                    <span>Telefonga O'rnatish:</span>
                                    <button onclick="installApp()" class="px-3 py-1 bg-sky-500 rounded-xl text-slate-950 font-bold">O'rnatish</button>
                                </div>
                                <div class="space-y-1">
                                    <div class="flex justify-between text-[10px]">
                                        <span>Yorqinlik:</span>
                                        <span id="bright-val">100%</span>
                                    </div>
                                    <input type="range" min="10" max="100" value="100" class="w-full accent-sky-500" oninput="changeBrightness(this.value)">
                                </div>
                            </div>
                            <button onclick="clearCache()" class="w-full py-2.5 bg-red-600/80 rounded-2xl font-bold text-white text-xs">Keshni Tozalash 🗑️</button>
                        </div>
                    `;
                    break;
            }
        }

        function changeBrightness(val) {
            document.getElementById('bright-val').innerText = val + '%';
            document.getElementById('brightness-overlay').style.opacity = (100 - val) / 100 * 0.8;
        }

        function clearCache() {
            localStorage.clear();
            if('caches' in window) { caches.keys().then(names => { names.forEach(n => caches.delete(n)); }); }
            alert('Kesh tozalandi!');
        }

        let phoneNum = "";
        function pressNum(n) {
            phoneNum += n;
            document.getElementById('phone-number').value = phoneNum;
        }
        function makeCall() {
            if(phoneNum) window.location.href = `tel:${phoneNum}`;
            else alert('Raqam kiritilmadi!');
        }
        function sendSms() {
            const txt = document.getElementById('sms-text').value;
            if(txt) window.location.href = `sms:?body=${encodeURIComponent(txt)}`;
            else alert('Xabar bo\'sh!');
        }

        let calcVal = "";
        function calcAppend(v) {
            calcVal += v;
            document.getElementById('calc-screen').value = calcVal;
        }
        function calcClear() {
            calcVal = "";
            document.getElementById('calc-screen').value = "0";
        }
        function calcEval() {
            try {
                calcVal = eval(calcVal).toString();
                document.getElementById('calc-screen').value = calcVal;
            } catch(e) { document.getElementById('calc-screen').value = "Xato"; calcVal = ""; }
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                .then(stream => {
                    videoStream = stream;
                    const v = document.getElementById('video');
                    if(v) v.srcObject = stream;
                }).catch(e => {});
        }

        function loadWeb() {
            const url = document.getElementById('browser-url').value;
            document.getElementById('browser-frame').src = url;
        }

        function loadUploadedFile(input) {
            if(input.files.length > 0) {
                const f = input.files[0];
                const list = document.getElementById('file-list');
                if(list) {
                    list.innerHTML += `<div class="p-2.5 bg-slate-900 rounded-xl border border-slate-800 flex justify-between text-xs mt-1"><span>📁 ${f.name}</span><span class="text-sky-400">${Math.round(f.size/1024)} KB</span></div>`;
                }
                const grid = document.getElementById('gallery-grid');
                if(grid && f.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = e => {
                        grid.innerHTML += `<img src="${e.target.result}" class="w-full h-24 object-cover rounded-xl border border-slate-700">`;
                    };
                    reader.readAsDataURL(f);
                }
            }
        }

        function loadMusicFile(input) {
            if(input.files.length > 0) {
                const f = input.files[0];
                document.getElementById('music-title').innerText = f.name;
                if(audioPlayer) audioPlayer.pause();
                audioPlayer = new Audio(URL.createObjectURL(f));
                audioPlayer.play();
            }
        }

        function runCommand() {
            const input = document.getElementById('terminal-input');
            const screen = document.getElementById('terminal-screen');
            const val = input.value.trim();
            if(val) {
                screen.innerHTML += `<br>root@tox-os:~# ${val}<br><span class="text-white">Bajarildi - OK</span>`;
                input.value = '';
                screen.scrollTop = screen.scrollHeight;
            }
        }
    </script>
</body>
</html>
