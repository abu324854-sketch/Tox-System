<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tox-System OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #090d16 0%, #020408 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .app-icon:active {
            transform: scale(0.92);
        }
        /* Ilova ochilgandagi animatsiya */
        #app-window {
            transition: all 0.3s ease;
            transform: scale(0.95);
            opacity: 0;
            pointer-events: none;
        }
        #app-window.active {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="text-white h-screen flex flex-col justify-between p-4 select-none overflow-hidden relative">

    <!-- Status Bar -->
    <div class="glass-panel flex justify-between items-center text-xs text-sky-300 px-4 py-2 rounded-2xl shadow-lg z-10">
        <span id="clock" class="font-mono font-bold">00:00</span>
        <span class="tracking-widest font-extrabold text-sky-400">TOX-SYSTEM KERNEL</span>
        <span id="battery" class="font-mono">--% ⚡</span>
    </div>

    <!-- Asosiy Ish Stoli (Desktop) -->
    <div id="desktop" class="flex-1 flex flex-col justify-center items-center px-2 z-10">
        <div class="w-full max-w-sm mb-6 text-center">
            <h2 class="text-[10px] uppercase tracking-widest text-slate-500 mb-1">Xususiy Ekotizim</h2>
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-500">Tox-System v1.0</h1>
        </div>

        <!-- Ilovalar Grid paneli -->
        <div class="grid grid-cols-4 gap-4 w-full max-w-sm mb-6">
            <div onclick="openApp('Himoya', '🛡️', 'Tizim xavfsizligi 100%. Tashqi tahdidlar topilmadi va firewall barqaror ishlamoqda.')" class="app-icon glass-panel flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">🛡️</span>
                <span class="text-[10px] text-slate-300 font-medium">Himoya</span>
            </div>
            <div onclick="openApp('Bulut', '🗄️', 'Mahalliy shifrlangan ombor ulandi. Ishlatilgan hajm: 0 MB / 128 GB.')" class="app-icon glass-panel flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">🗄️</span>
                <span class="text-[10px] text-slate-300 font-medium">Bulut</span>
            </div>
            <div onclick="openApp('Terminal', '💻', 'root@tox-system:~# status --active\nKernel: stable\nMemory: optimized\nSecure connection established.')" class="app-icon glass-panel flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">💻</span>
                <span class="text-[10px] text-slate-300 font-medium">Terminal</span>
            </div>
            <div onclick="openApp('Temir', '📊', 'Qurilma arxitekturasi tekshirildi. Oqim va chastotalar nazorat ostida.')" class="app-icon glass-panel flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">📊</span>
                <span class="text-[10px] text-slate-300 font-medium">Temir</span>
            </div>
            <div onclick="openApp('Aloqa', '📡', 'Shaxsiy chastota (Secure Node) tarmog\'iga ulangan. Signalli uzatish xavfsiz.')" class="app-icon glass-panel flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">📡</span>
                <span class="text-[10px] text-slate-300 font-medium">Aloqa</span>
            </div>
            <div onclick="openApp('Fayllar', '📁', '/system/apps/ katalogi tekshirildi. Barcha modullar o\'rnatilgan va ishga tayyor.')" class="app-icon glass-panel flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">📁</span>
                <span class="text-[10px] text-slate-300 font-medium">Fayllar</span>
            </div>
            <div onclick="openApp('Shifr', '🔐', 'AES-256 protokoli faol. Ma\'lumotlar shifrlangan holda saqlanmoqda.')" class="app-icon glass-panel flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">🔐</span>
                <span class="text-[10px] text-slate-300 font-medium">Shifr</span>
            </div>
            <div onclick="openApp('Sozlamalar', '⚙️', 'Versiya: Tox-System v1.0\nMuallif: Fattoxov Abdulloh (Toxirjon Core)\nHolat: Mustaqil yadro.')" class="app-icon glass-panel flex flex-col items-center justify-center p-3.5 rounded-2xl cursor-pointer transition">
                <span class="text-2xl mb-1">⚙️</span>
                <span class="text-[10px] text-slate-300 font-medium">Sozlama</span>
            </div>
        </div>

        <div class="glass-panel w-full max-w-sm p-3 rounded-2xl text-xs text-slate-400 text-center font-mono">
            [Tox-Core]: Asosiy ekran faol. Ilovani tanlang.
        </div>
    </div>

    <!-- TO'LIQ EKRANDAGI ILOVA OYNASI (App Window) -->
    <div id="app-window" class="absolute inset-4 top-16 bottom-20 glass-panel rounded-3xl p-6 flex flex-col justify-between z-20 shadow-2xl border border-sky-500/30">
        <div>
            <!-- Ilova sarlavhasi -->
            <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
                <div class="flex items-center space-x-3">
                    <span id="app-icon-lg" class="text-3xl">📱</span>
                    <h2 id="app-title-lg" class="text-lg font-bold text-sky-400">Ilova Nomi</h2>
                </div>
                <button onclick="closeApp()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 w-8 h-8 rounded-full flex items-center justify-center text-sm transition">✕</button>
            </div>
            <!-- Ilova ichki mazmuni -->
            <div id="app-content-lg" class="text-sm text-slate-300 font-mono leading-relaxed whitespace-pre-line">
                Ilova ma'lumotlari yuklanmoqda...
            </div>
        </div>
        <div class="text-center text-[10px] text-slate-500 font-mono">
            Tox-System Secure Environment
        </div>
    </div>

    <!-- Pastki Dock paneli -->
    <div class="glass-panel rounded-2xl p-3 flex justify-around items-center z-10">
        <button onclick="closeApp()" class="text-xl hover:scale-110 transition">🏛️</button>
        <button onclick="openApp('Terminal', '💻', 'root@tox-system:~# direct-exec\nAll systems nominal.')" class="text-xl hover:scale-110 transition">⚡</button>
        <button onclick="openApp('Sozlamalar', '⚙️', 'Versiya: Tox-System v1.0\nToxirjon Core')" class="text-xl hover:scale-110 transition">⚙️</button>
    </div>

    <script>
        // Soat
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        // Batareya holati
        if ('getBattery' in navigator) {
            navigator.getBattery().then(battery => {
                const updateBat = () => {
                    document.getElementById('battery').innerText = Math.round(battery.level * 100) + '% ⚡';
                };
                updateBat();
                battery.addEventListener('levelchange', updateBat);
            });
        } else {
            document.getElementById('battery').innerText = '100% ⚡';
        }

        // Ilovani to'liq ekranda ochish
        function openApp(name, icon, content) {
            document.getElementById('app-title-lg').innerText = name;
            document.getElementById('app-icon-lg').innerText = icon;
            document.getElementById('app-content-lg').innerText = content;
            document.getElementById('app-window').classList.add('active');
        }

        // Ilovani yopib bosh ekranga qaytish
        function closeApp() {
            document.getElementById('app-window').classList.remove('active');
        }
    </script>
</body>
</html>
